[package]
name = "account-crypto"
version = "1.0.0"
edition = "2021"
authors = ["voyager_rhett <chinanation@icloud.com>"]
repository = "https://github.com/VoyagerRhett/GMB"
homepage = "https://github.com/VoyagerRhett/GMB"
license = "MIT"
description = "citizenapp 内部账户数据用途钥派生和加密交付原语"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1.8"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace]
