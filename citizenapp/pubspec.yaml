name: citizenapp
description: CitizenApp mobile client using CitizenSDK blockchain capabilities.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 钱包、签名、唯一 QR_V1、轻节点、链读取、交易与 execution history
  # 统一由同仓 CitizenSDK 提供；CitizenApp 只保留产品 UI 和业务语义。
  citizen_sdk:
    path: ../citizensdk
  cupertino_icons: 1.0.9
  http: ^1.2.2
  shared_preferences: ^2.5.5
  polkadart: ^0.7.0
  # 0.7.1 与本产品使用的 polkadart 0.7.x 共同依赖 ss58 1.x；0.7.2 已切到
  # ss58 2.x，会造成解依赖冲突。两款移动产品统一锁定同一兼容版本。
  polkadart_keyring: 0.7.1
  # 扫码设备适配已归入 lib/qr/scanner，不再保留内部 package 包装层。
  mobile_scanner: 7.4.2
  qr: ^3.0.2
  qr_flutter: ^4.1.0
  flutter_svg: ^2.3.0
  local_auth: ^3.0.2
  # 生物识别对话框文案本地化需要直接引用消息类(local_auth 不再导出它们)。
  # 版本跟随 local_auth 的传递依赖,不单独升级。
  local_auth_android: 2.0.9
  local_auth_darwin: ^2.0.0
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.3
  # 发布页统一相册：双端同一网格，支持图片数量上限及“多图或单视频”选择中互斥。
  wechat_assets_picker: ^10.1.2
  # Chat 应用内拍摄：统一实现点按拍照、长按录像与三分钟自动停止。
  camera: ^0.12.0+2
  # Chat 语音消息：录音只写入 App 临时目录，发送后进入既有端到端附件通道。
  record: ^7.1.1
  # Chat 语音气泡只播放本机已解密缓存文件，不启用后台播放或远程代理。
  just_audio: ^0.10.6
  crypto: ^3.0.3
  # 应用锁使用标准 PBKDF2-HMAC-SHA256 实现，避免手写循环产生额外分配。
  pointycastle: ^4.0.0
  # isar 3.1 上游已停更且预编译 .so 未 16KB 对齐;改用社区维护分支 isar_community
  # (沿用 isar 3.x API 与 DB 格式,不迁移数据;libisar.so 已 16KB 对齐)。
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  saver_gallery: 5.1.0
  # CitizenApp 不实现 sr25519；钱包签名与验签全部由 CitizenSDK 提供。
  # polkadart_keyring 仅用于 App 现有 SS58 地址编解码，禁止用它另造签名实现。
  protobuf: ^6.0.0
  path: ^1.9.1
  fixnum: ^1.1.1
  flutter_chat_ui: ^2.11.1
  flutter_chat_core: ^2.9.0
  # Chat 自绘 Composer 通过现有 flutter_chat_ui Provider 同步输入栏高度。
  provider: ^6.1.5+1
  cryptography: ^2.9.0
  url_launcher: ^6.3.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  webview_flutter: ^4.13.0
  video_player: 2.11.1
  image_size_getter: ^2.4.1
  flutter_image_compress: 2.4.0
  blurhash_dart: ^1.2.1
  image: 4.9.1
  # 文章正文富文本编辑器；11.5.1 实现 Flutter 3.44 新增的 TextInputClient.onFocusReceived。
  flutter_quill: 11.5.1
  # CitizenApp 本机开发直接读取 TATA 仓库中的 TataChatSDK 唯一源码。
  tatachat_sdk:
    path: ../../TATA/tatachatsdk
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # 两款移动产品共同使用的代码生成器固定同一解析版本。
  build_runner: 2.15.0
  isar_community_generator: ^3.3.2
  protoc_plugin: 25.0.0

flutter:
  # 两款移动产品在 Flutter 3.44.4 下统一使用 CocoaPods，禁止本机全局配置
  # 把某一产品单独切到 Swift Package Manager 后形成双轨原生依赖状态。
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/profile_defaults/
    - assets/badges/
    - assets/topup/walletconnect.html
    - assets/topup/walletconnect.bundle.js
    - assets/public_institutions/
    - assets/admin_divisions/
    - assets/admin_divisions/cities/
    - assets/admin_divisions/towns/
    - assets/icons/scan-line.svg
    - assets/icons/wallet.svg
    - assets/icons/copy.svg
    - assets/icons/arrow-right-left.svg
    - assets/icons/file-user.svg
    - assets/icons/message-square-text.svg
    - assets/icons/scale.svg
    - assets/icons/tank.svg
    - assets/icons/square-person-tank-watermark.png
    - assets/icons/contact-round.svg
    - assets/icons/download.svg
    - assets/icons/government-line.svg
    - assets/icons/bank.svg
    - assets/icons/gmb-mark.png
    - assets/icons/usdc.svg
    - assets/icons/usdt.svg
    - assets/icons/icons8-96.png
    - assets/icons/icons8-64.png
  fonts:
    - family: LXGWWenKaiLite
      fonts:
        - asset: assets/fonts/LXGWWenKaiLite-Regular.ttf
    - family: FZJingLeiS
      fonts:
        - asset: assets/fonts/FZJingLeiS-R-GB.ttf
