[workspace]

[package]
name = "smoldot_ffi"
version = "1.0.0"
edition = "2021"
authors = ["GMB (VoyagerRhett)"]
license = "Apache-2.0"
description = "FFI bindings for smoldot-light"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "smoldot"

[dependencies]
# 固定引用仓库内收编的 PoW 轻节点快照，禁止再回指根目录临时 smoldot。
smoldot-light = { path = "../pow/light-base" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
parking_lot = "0.12"
once_cell = "1.19"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
blake2-rfc = "0.2"
hex = "0.4"
# MLS 本地状态(设备签名私钥 + 群 ratchet 秘密)落盘信封加密。
# 用 RustCrypto 官方实现，禁止自造 AEAD。
aes-gcm = "0.10"
hpke-rs = { version = "0.6.1", features = ["rustcrypto", "std"] }
hpke-rs-rust-crypto = { version = "0.6.1", features = ["std"] }
base64 = "0.22"
# App 内部 sr25519 原生签名实现，不引用其它产品。
# 禁止在本 crate 内另写 sr25519 实现。
citizen-signer = { path = "../../native/citizen-signer" }
# App 内部账户数据用途钥派生和冷钱包加密交付实现。
account-crypto = { path = "../../native/account-crypto" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
# 磁盘产物始终保留符号+行号,原生崩溃栈才能反解到 Rust 源码行(留档即符号服务器)。
# APK 侧由 AGP 分档处理:debug 包保留、release 包打包时剥离,见 android/app/build.gradle.kts。
strip = false
debug = 1
# 必须 unwind:citizen-signer 的 4 个 FFI 入口靠 `catch_unwind` 把内部 panic 兜成
# 错误码;`panic = "abort"` 下 catch_unwind 形同虚设,panic 直接 abort 掉 App,
# 「绝不 abort」的安全承诺就是假的。未包 catch_unwind 的 smoldot_* 入口不受影响:
# Rust 对 `extern "C"` 边界自带 abort-on-unwind 兜底,行为与之前一致。
panic = "unwind"

[profile.dev]
opt-level = 1          # Faster compilation in dev

[build-dependencies]
cbindgen = "0.27"
