group = 'org.citizen.sdk'
version = rootProject.version

apply plugin: 'com.android.library'
// 与Flutter库共用独立入口已选定的AGP及内置Kotlin，不另选版本。
// projectDir 是任务目录；输入路径必须显式指向原 SDK，不能从任务目录推导。
def sdkSourceValue = System.getenv('CITIZENSDK_SOURCE_DIR')
if (!sdkSourceValue || !new File(sdkSourceValue).isAbsolute()) {
    throw new GradleException('CitizenSDK native Android requires an absolute source directory')
}
def sdkProductRoot = new File(sdkSourceValue).canonicalFile
def nativeSourceRoot = new File(sdkProductRoot, 'android/native')

// 只供独立AAR工程读取中央选版；正式Flutter插件不依赖此模块或控制台目录。
def cmakeVersion = providers.exec {
    commandLine 'node', '--input-type=module', '-e', '''
import { join, isAbsolute } from 'node:path';
import { pathToFileURL } from 'node:url';
const root = process.env.TATA_WORKSPACE_ROOT || process.env.TATA_ROOT;
const flows = process.env.TATA_CONSOLE_FLOW_ROOT || (root && join(root, 'tataconsole', 'flows'));
if (!flows || !isAbsolute(flows)) throw Error('CitizenSDK独立Android缺少中央流程绝对路径');
const { readCmake } = await import(pathToFileURL(join(flows, '..', 'tools', 'android.mjs')));
const platform = process.platform === 'darwin' ? 'macos'
  : process.platform === 'win32' ? 'windows'
  : process.platform === 'linux' && process.arch === 'arm64' ? 'linux-arm'
  : process.platform === 'linux' && process.arch === 'x64' ? 'linux-amd' : null;
console.log(readCmake(platform).version);
'''
}.standardOutput.asText.get().trim()

def tataConsoleTargetRoot = file('/Users/rhett/TATA/tataconsole/target').canonicalFile
def localCitizenSdkRoots = { boolean buildOnly = false ->
    def roots = [new File(tataConsoleTargetRoot.parentFile, 'cache/gmb/citizensdk').canonicalFile]
    // 编译只能写测试库；验真原件输入仍可消费产物库的正式成功文件。
    if (!buildOnly) roots.add(new File(tataConsoleTargetRoot, 'gmb/citizensdk').canonicalFile)
    def taskWorkValue = System.getenv('TATA_CONSOLE_CACHE_DIR')
    if (taskWorkValue != null && !taskWorkValue.trim().isEmpty()) {
        def taskWork = file(taskWorkValue).canonicalFile
        def sharedWorkRoot = new File(tataConsoleTargetRoot.parentFile, 'cache').canonicalFile
        if (taskWork.path.startsWith(sharedWorkRoot.path + File.separator)) {
            // 与 Flutter 插件工程使用同一中央目录边界，避免两个 Gradle 工程判断不一致。
            roots.add(new File(taskWork, 'citizensdk').canonicalFile)
        }
    }
    roots
}
def staysInLocalCitizenSdkRoot = { File candidate, boolean buildOnly = false ->
    localCitizenSdkRoots(buildOnly).any { File root ->
        candidate.path == root.path || candidate.path.startsWith(root.path + File.separator)
    }
}
def configuredBuildDir = System.getenv('CITIZENSDK_ANDROID_BUILD_DIR')
def fallbackRoot = new File(System.getProperty('java.io.tmpdir'), 'citizensdk-unconfigured')
def normalizedTarget = configuredBuildDir == null || configuredBuildDir.trim().isEmpty()
    ? new File(fallbackRoot, 'android-native').canonicalFile
    : file(configuredBuildDir).canonicalFile
if (configuredBuildDir != null && !configuredBuildDir.trim().isEmpty()) {
    def githubActions = System.getenv('GITHUB_ACTIONS') == 'true'
    if (githubActions) {
        def workspace = System.getenv('GITHUB_WORKSPACE')
        if (workspace != null && !workspace.trim().isEmpty()) {
            def sourceRoot = file(workspace).canonicalFile
            if (normalizedTarget.path == sourceRoot.path ||
                normalizedTarget.path.startsWith(sourceRoot.path + File.separator)) {
                throw new GradleException('CitizenSDK Android output must be outside the GitHub source checkout')
            }
        }
    } else {
        if (!staysInLocalCitizenSdkRoot(normalizedTarget, true)) {
            throw new GradleException('CitizenSDK Android build output must stay in its central work directory or current host task')
        }
    }
}
def nativeTarget = new File(normalizedTarget, 'native')
buildDir = nativeTarget

def coreDirValue = System.getenv('CITIZENSDK_ANDROID_CORE_DIR')
def coreDir = coreDirValue == null || coreDirValue.trim().isEmpty()
    ? new File(fallbackRoot, 'arm64-v8a').canonicalFile
    : file(coreDirValue).canonicalFile
def coreLibrary = new File(coreDir, 'libcitizensdk.so')
def zxingSourceValue = System.getenv('CITIZENSDK_ZXING_SOURCE_DIR')
def zxingSource = zxingSourceValue == null || zxingSourceValue.trim().isEmpty()
    ? new File(fallbackRoot, 'zxing-cpp-3.1.1').canonicalFile
    : file(zxingSourceValue).canonicalFile

android {
    namespace = 'org.citizen.sdk'
    compileSdk = 36
    ndkVersion = '28.2.13676358'

    defaultConfig {
        minSdk = 24
        consumerProguardFiles new File(nativeSourceRoot, 'consumer-rules.pro')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17', '-Wall', '-Wextra', '-Werror', '-fvisibility=hidden'
                arguments '-DANDROID_STL=c++_static',
                    "-DCITIZENSDK_CORE_DIR=${coreDir.absolutePath}",
                    "-DCITIZENSDK_INTERNAL_INCLUDE_DIR=${System.getenv('CITIZENSDK_INTERNAL_INCLUDE_DIR') ?: ''}",
                    "-DCITIZENSDK_ZXING_SOURCE_DIR=${zxingSource.absolutePath}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = new File(nativeSourceRoot, 'src/main/cpp/CMakeLists.txt')
            version = cmakeVersion
            // CMake状态属于调用方当前任务，不写入源码或其它任务目录。
            buildStagingDirectory = new File(normalizedTarget, 'native-cmake')
        }
    }

    sourceSets {
        all { sourceSet ->
            def sourceRoot = new File(nativeSourceRoot, "src/${sourceSet.name}")
            sourceSet.setRoot(sourceRoot.path)
            sourceSet.kotlin.srcDirs = [new File(sourceRoot, 'kotlin')]
        }
        main {
            // AAR consumers receive the same verified assets as Flutter.
            assets.srcDirs = [new File(sdkProductRoot, 'assets')]
            // jniLibs expects the parent whose direct child is arm64-v8a.
            jniLibs.srcDirs = [coreDir.parentFile]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = false
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
            excludes += [
                'lib/armeabi*/**',
                'lib/x86/**',
                'lib/x86_64/**',
                '**/libsmoldot.so',
                '**/libc++_shared.so',
            ]
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// 两种分发面保持相同JVM目标与接口默认实现，不重复旧字符串编译参数。
// apply from 的脚本不另声明插件版本；只复用当前 Kotlin 插件公开枚举。
def kotlinPluginLoader = extensions.getByName('kotlin').getClass().getClassLoader()
def kotlinJvmTarget = kotlinPluginLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.JvmTarget')
def kotlinJvmDefault = kotlinPluginLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode')
kotlin {
    compilerOptions {
        jvmTarget = kotlinJvmTarget.JVM_17
        jvmDefault = kotlinJvmDefault.NO_COMPATIBILITY
    }
}

// 独立settings登记native模块；显式原生任务在执行前验证两个生产输入。
// Flutter宿主只引入根库模块，不执行此独立子工程。
tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.doFirst {
            if (configuredBuildDir == null || configuredBuildDir.trim().isEmpty()) {
                throw new GradleException('CITIZENSDK_ANDROID_BUILD_DIR is required for native AAR tasks')
            }
            if (coreDirValue == null || coreDirValue.trim().isEmpty() || !coreLibrary.isFile()) {
                throw new GradleException(
                    'CITIZENSDK_ANDROID_CORE_DIR must be an arm64-v8a leaf containing libcitizensdk.so'
                )
            }
            if (coreDir.name != 'arm64-v8a') {
                throw new GradleException('CITIZENSDK_ANDROID_CORE_DIR must end in arm64-v8a')
            }
            if (zxingSourceValue == null || zxingSourceValue.trim().isEmpty() ||
                !new File(zxingSource, 'core/src/ZXingC.h').isFile()) {
                throw new GradleException('CITIZENSDK_ZXING_SOURCE_DIR must contain official ZXing-C++ 3.1.1')
            }
        }
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
