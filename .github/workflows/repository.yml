    name: 核验本仓最新成功塔塔门禁
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
    - name: 核验当前main与门禁Run
      shell: bash
      env:
        GH_TOKEN: "${{ github.token }}"
        GATE_RUN_ID: "${{ inputs.repository_gate_run_id }}"
      run: |-
        node --input-type=module <<'NODE'
        const repo="VoyagerRhett/GMB",expected=process.env.GATE_RUN_ID,sha=process.env.GITHUB_SHA;
        if(!/^[1-9][0-9]*$/.test(expected||"")||!/^[0-9a-f]{40}$/.test(sha||""))throw Error("CI门禁身份无效");
        const headers={Accept:"application/vnd.github+json",Authorization:`Bearer ${process.env.GH_TOKEN}`,"User-Agent":"TataConsole"};
        const get=async u=>{const r=await fetch(`https://api.github.com/${u}`,{headers});if(!r.ok)throw Error(`GitHub ${r.status}`);return r.json()};
        const main=await get(`repos/${repo}/commits/main`);if(main.sha!==sha)throw Error("CI源码不是当前main");
        let found=[];for(let page=1;page<=1000&&!found.length;page++){const x=await get(`repos/${repo}/actions/workflows/repository.yml/runs?event=workflow_dispatch&branch=main&per_page=100&page=${page}`),rows=x.workflow_runs||[];found=rows.filter(r=>r.head_sha===sha&&r.status==="completed"&&r.conclusion==="success"&&String(r.display_title||"").startsWith("GMB · 全仓门禁 · "));if(rows.length<100)break}
        found.sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)||Number(b.id)-Number(a.id));if(String(found[0]?.id)!==expected)throw Error("本仓最新GitHub塔塔门禁未成功");
