# 本仓唯一GitHub入口；每个Job只启动其准确产品流程文件，入口不承载跨仓实现。
name: GMB · 塔塔流程
run-name: "${{ inputs.run_title }} · ${{ inputs.local_task_id }}"
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        required: true
        type: string
      run_title:
        required: true
        type: string
      local_task_id:
        required: true
        type: string
      lease_id:
        required: false
        type: string
      proof:
        required: false
        type: string
      base_sha:
        required: false
        type: string
      source_sha:
        required: false
        type: string
      repository_gate_run_id:
        required: false
        type: string
      ci_run_id:
        required: false
        type: string
      version_tag:
        required: false
        type: string
      software_version:
        required: false
        type: string
      spec_version:
        required: false
        type: string
      chain_spec_version:
        required: false
        type: string
      genesis_hash:
        required: false
        type: string
      finalized_head:
        required: false
        type: string
concurrency:
  group: gmb.${{ inputs.pipeline }}
  cancel-in-progress: false
jobs:
  validate_pipeline:
    name: 验证本仓准确pipeline
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PIPELINE: "${{ inputs.pipeline }}"
      LOCAL_TASK_ID: "${{ inputs.local_task_id }}"
      LEASE_ID: "${{ inputs.lease_id }}"
      PROOF: "${{ inputs.proof }}"
      BASE_SHA: "${{ inputs.base_sha }}"
      SOURCE_SHA: "${{ inputs.source_sha }}"
      REPOSITORY_GATE_RUN_ID: "${{ inputs.repository_gate_run_id }}"
      CI_RUN_ID: "${{ inputs.ci_run_id }}"
      VERSION_TAG: "${{ inputs.version_tag }}"
      SOFTWARE_VERSION: "${{ inputs.software_version }}"
      SPEC_VERSION: "${{ inputs.spec_version }}"
      CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
      GENESIS_HASH: "${{ inputs.genesis_hash }}"
      FINALIZED_HEAD: "${{ inputs.finalized_head }}"
    steps:
    - shell: bash
      run: |
        node --input-type=module <<'NODE'
        const e=process.env,p=e.PIPELINE,allowed=new Set(["gmb.citizenapp.android.ci","gmb.citizenapp.android.release","gmb.citizenapp.ios.ci","gmb.citizenapp.ios.release","gmb.citizenchain-node.linux-amd.ci","gmb.citizenchain-node.linux-amd.release","gmb.citizenchain-node.linux-arm.ci","gmb.citizenchain-node.linux-arm.release","gmb.citizenchain-node.macos.ci","gmb.citizenchain-node.macos.release","gmb.citizenchain-node.windows.ci","gmb.citizenchain-node.windows.release","gmb.citizenchain-runtime.wasm.ci","gmb.citizenchain-runtime.wasm.release","gmb.citizenchatserver.cloudflare.ci","gmb.citizenchatserver.cloudflare.release","gmb.citizensdk.sdk.ci","gmb.citizensdk.sdk.release","gmb.citizenserve.cloudflare.ci","gmb.citizenserve.cloudflare.release","gmb.citizenwallet.android.ci","gmb.citizenwallet.android.release","gmb.citizenwallet.ios.ci","gmb.citizenwallet.ios.release","gmb.citizenweb.web.ci","gmb.citizenweb.web.release","repository"]);
        const fail=m=>{throw new Error(m)},empty=(...v)=>v.every(x=>x==='');
        if(!allowed.has(p)||!/^\d{9}$/.test(e.LOCAL_TASK_ID||'')||e.LOCAL_TASK_ID[0]==='0')fail('流水线身份无效');
        const cross=true,lease=/^[0-9A-F]{24}$/.test(e.LEASE_ID||'')&&/^[0-9a-f]{64}$/.test(e.PROOF||'');
        if(cross!==lease&&p!=='repository')fail('产品流程租约无效');
        if(p==='repository'){
          if(!/^[0-9a-f]{40}$/.test(e.BASE_SHA||'')||!/^[0-9a-f]{40}$/.test(e.SOURCE_SHA||'')||e.BASE_SHA===e.SOURCE_SHA||!empty(e.REPOSITORY_GATE_RUN_ID,e.CI_RUN_ID,e.VERSION_TAG,e.SOFTWARE_VERSION,e.SPEC_VERSION,e.CHAIN_SPEC_VERSION,e.GENESIS_HASH,e.FINALIZED_HEAD)||((false)&& !empty(e.LEASE_ID,e.PROOF))||((true)&&!lease))fail('仓库门禁输入无效');
        }else if(p.endsWith('.ci')){
          if(!/^[1-9][0-9]*$/.test(e.REPOSITORY_GATE_RUN_ID||'')||!empty(e.BASE_SHA,e.SOURCE_SHA,e.CI_RUN_ID,e.VERSION_TAG,e.SOFTWARE_VERSION,e.SPEC_VERSION,e.CHAIN_SPEC_VERSION,e.GENESIS_HASH,e.FINALIZED_HEAD))fail('CI输入无效');
        }else{
          if(!p.endsWith('.release')||!/^[0-9a-f]{40}$/.test(e.SOURCE_SHA||'')||!/^[1-9][0-9]*$/.test(e.CI_RUN_ID||'')||!/^[a-z0-9-]+-v\d+\.\d{1,2}\.\d{1,2}$/.test(e.VERSION_TAG||'')||!/^\d+\.\d{1,2}\.\d{1,2}$/.test(e.SOFTWARE_VERSION||'')||!empty(e.BASE_SHA,e.REPOSITORY_GATE_RUN_ID))fail('Release输入无效');
        }
        NODE
  repository_contracts:
    name: repository-contracts
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: VoyagerRhett/TATA
        ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}"
        token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}"
        path: ".tata-flow"
        persist-credentials: false
    - run: |-
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{ github.repository }}"
      shell: bash
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ inputs.source_sha }}"
        fetch-depth: 0
        persist-credentials: false
        clean: false
    - name: 执行GMB独立塔塔门禁
      shell: bash
      env:
        TATA_CONSOLE_SOURCE_ROOT: "$GITHUB_WORKSPACE/.tata-flow/tataconsole"
        TATA_WORKSPACE_ROOT: "$GITHUB_WORKSPACE/.tata-flow"
        TATA_CONSOLE_CACHE_DIR: "$RUNNER_TEMP/gmb-repository-gate"
      run: node "$GITHUB_WORKSPACE/.tata-flow/tataconsole/flows/gmb/repository-gate.mjs" remote "$GITHUB_WORKSPACE" "${{ inputs.base_sha }}" "${{ inputs.source_sha }}" repository-contracts
    if: "${{ inputs.pipeline == 'repository' }}"
    needs: validate_pipeline
  dependency_contracts:
    name: dependency-contracts
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: VoyagerRhett/TATA
        ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}"
        token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}"
        path: ".tata-flow"
        persist-credentials: false
    - run: |-
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{ github.repository }}"
      shell: bash
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ inputs.source_sha }}"
        fetch-depth: 0
        persist-credentials: false
        clean: false
    - name: 执行GMB独立塔塔门禁
      shell: bash
      env:
        TATA_CONSOLE_SOURCE_ROOT: "$GITHUB_WORKSPACE/.tata-flow/tataconsole"
        TATA_WORKSPACE_ROOT: "$GITHUB_WORKSPACE/.tata-flow"
        TATA_CONSOLE_CACHE_DIR: "$RUNNER_TEMP/gmb-repository-gate"
      run: node "$GITHUB_WORKSPACE/.tata-flow/tataconsole/flows/gmb/repository-gate.mjs" remote "$GITHUB_WORKSPACE" "${{ inputs.base_sha }}" "${{ inputs.source_sha }}" dependency-contracts
    if: "${{ inputs.pipeline == 'repository' }}"
    needs: validate_pipeline
  cross_platform_contracts:
    name: cross-platform-contracts
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: VoyagerRhett/TATA
        ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}"
        token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}"
        path: ".tata-flow"
        persist-credentials: false
    - run: |-
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{ github.repository }}"
      shell: bash
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ inputs.source_sha }}"
        fetch-depth: 0
        persist-credentials: false
        clean: false
    - name: 执行GMB独立塔塔门禁
      shell: bash
      env:
        TATA_CONSOLE_SOURCE_ROOT: "$GITHUB_WORKSPACE/.tata-flow/tataconsole"
        TATA_WORKSPACE_ROOT: "$GITHUB_WORKSPACE/.tata-flow"
        TATA_CONSOLE_CACHE_DIR: "$RUNNER_TEMP/gmb-repository-gate"
      run: node "$GITHUB_WORKSPACE/.tata-flow/tataconsole/flows/gmb/repository-gate.mjs" remote "$GITHUB_WORKSPACE" "${{ inputs.base_sha }}" "${{ inputs.source_sha }}" cross-platform-contracts
    if: "${{ inputs.pipeline == 'repository' }}"
    needs: validate_pipeline
  shared_contracts:
    name: shared-contracts
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: VoyagerRhett/TATA
        ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}"
        token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}"
        path: ".tata-flow"
        persist-credentials: false
    - run: |-
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{ github.repository }}"
      shell: bash
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ inputs.source_sha }}"
        fetch-depth: 0
        persist-credentials: false
        clean: false
    - name: 执行GMB独立塔塔门禁
      shell: bash
      env:
        TATA_CONSOLE_SOURCE_ROOT: "$GITHUB_WORKSPACE/.tata-flow/tataconsole"
        TATA_WORKSPACE_ROOT: "$GITHUB_WORKSPACE/.tata-flow"
        TATA_CONSOLE_CACHE_DIR: "$RUNNER_TEMP/gmb-repository-gate"
      run: node "$GITHUB_WORKSPACE/.tata-flow/tataconsole/flows/gmb/repository-gate.mjs" remote "$GITHUB_WORKSPACE" "${{ inputs.base_sha }}" "${{ inputs.source_sha }}" shared-contracts
    if: "${{ inputs.pipeline == 'repository' }}"
    needs: validate_pipeline
  flow_001:
    name: 核验本仓最新成功塔塔门禁
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
    - name: 核验当前main与门禁Run
      shell: bash
      env:
        GH_TOKEN: "${{ github.token }}"
        GATE_RUN_ID: "${{ inputs.repository_gate_run_id }}"
      run: |-
        node --input-type=module <<'NODE'
        const repo="VoyagerRhett/GMB",expected=process.env.GATE_RUN_ID,sha=process.env.GITHUB_SHA;
        if(!/^[1-9][0-9]*$/.test(expected||"")||!/^[0-9a-f]{40}$/.test(sha||""))throw Error("CI门禁身份无效");
        const headers={Accept:"application/vnd.github+json",Authorization:`Bearer ${process.env.GH_TOKEN}`,"User-Agent":"TataConsole"};
        const get=async u=>{const r=await fetch(`https://api.github.com/${u}`,{headers});if(!r.ok)throw Error(`GitHub ${r.status}`);return r.json()};
        const main=await get(`repos/${repo}/commits/main`);if(main.sha!==sha)throw Error("CI源码不是当前main");
        let found=[];for(let page=1;page<=1000&&!found.length;page++){const x=await get(`repos/${repo}/actions/workflows/repository.yml/runs?event=workflow_dispatch&branch=main&per_page=100&page=${page}`),rows=x.workflow_runs||[];found=rows.filter(r=>r.head_sha===sha&&r.status==="completed"&&r.conclusion==="success"&&String(r.display_title||"").startsWith("GMB · 全仓门禁 · "));if(rows.length<100)break}
        found.sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)||Number(b.id)-Number(a.id));if(String(found[0]?.id)!==expected)throw Error("本仓最新GitHub塔塔门禁未成功");
        NODE
    if: "${{ inputs.pipeline == 'gmb.citizenapp.android.ci' }}"
    needs: validate_pipeline
  flow_002:
    name: Flutter 代码检查
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      GMB_SOURCE_SHA: "${{ github.sha }}"
      SOURCE_SHA: "${{ github.sha }}"
    steps:
    - name: 验证准确流程租约
      shell: bash
      env:
        FLOW_LEASE_ID: "${{ inputs.lease_id }}"
        FLOW_SECRET_LEASE_ID: "${{ secrets[format('TATA_FLOW_LEASE_ID_{0}', inputs.lease_id)] }}"
        FLOW_COMMIT_SHA: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}"
        FLOW_BUNDLE_KEY: "${{ secrets[format('TATA_FLOW_BUNDLE_KEY_{0}', inputs.lease_id)] }}"
        FLOW_PROOF: "${{ inputs.proof }}"
      run: |-
        node <<'NODE'
        const {createHmac,timingSafeEqual}=require('node:crypto'),e=process.env;
        const payload=['tata-flow-lease-v1',e.FLOW_LEASE_ID,'VoyagerRhett/GMB',e.FLOW_COMMIT_SHA,'gmb.citizenapp.android.ci','',''].join('\n');
        const expected=createHmac('sha256',e.FLOW_BUNDLE_KEY||'').update(payload).digest();
        const actual=Buffer.from(e.FLOW_PROOF||'','hex');
        if(!/^[0-9A-F]{24}$/.test(e.FLOW_LEASE_ID||'')||e.FLOW_SECRET_LEASE_ID!==e.FLOW_LEASE_ID||!/^[0-9a-f]{40}$/.test(e.FLOW_COMMIT_SHA||'')||actual.length!==expected.length||!timingSafeEqual(actual,expected))throw Error('流程租约无效');
        NODE
    - name: 检出准确TATA流程提交
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: VoyagerRhett/TATA
        ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}"
        token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}"
        path: ".tata-flow"
        persist-credentials: false
    - name: 建立本仓检出边界
      shell: bash
      run: |-
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{ github.repository }}"
    - name: 检出准确产品源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
        clean: false
    - name: 登记准确流程根
      shell: bash
      run: printf 'TATA_CONSOLE_FLOW_ROOT=%s\n' "$GITHUB_WORKSPACE/.tata-flow/tataconsole/flows" >> "$GITHUB_ENV"
    - shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 0
    - id: citizenapp_ci_android__check__ci_cache
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_PRODUCT: citizenapp
        CI_CACHE_PLATFORM: android
        CI_CACHE_ARCHITECTURE: arm64
        CI_CACHE_COMPONENT: citizenapp-ci-android--check
        CI_CACHE_WORKFLOW: citizenapp-android
        CI_CACHE_JOB: citizenapp-ci-android--check
        CI_CACHE_TOOLCHAIN_FINGERPRINT: "${{ hashFiles('.tata-flow/tataconsole/tools/shared.json', '.tata-flow/tataconsole/tools/flutter.mjs', '.tata-flow/tataconsole/tools/flutter.patch', '.github/dependencies.json', 'Cargo.lock', '**/Cargo.lock', '**/pubspec.lock', '**/package-lock.json') }}"
        CI_CACHE_PATHS: |
          cargo-home
          cargo-target
          dart-pub
          gradle
          flutter-build
          xdg
        CI_CACHE_LINKS: 'citizenapp/build=flutter-build

          '
        CI_CACHE_FINALS: |
          flutter-build/app/outputs/flutter-apk
          flutter-build/app/outputs/bundle
      shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 1
    - name: 恢复上一次成功的CI增量缓存
      continue-on-error: true
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.citizenapp_ci_android__check__ci_cache.outputs.success_paths }}"
        key: "${{ steps.citizenapp_ci_android__check__ci_cache.outputs.restore_key }}"
    - shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 2
    - shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 3
    - shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 4
    - shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 5
    - id: citizenapp_ci_android__check__flutter-version
      shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 6
    - name: 安装 Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: "${{ steps.citizenapp_ci_android__check__flutter-version.outputs.version }}"
    - shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 7
    - working-directory: citizenapp
      shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 8
    - working-directory: citizenapp
      shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 9
    - if: "${{ failure() && !cancelled() }}"
      env:
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 10
    - if: "${{ failure() && !cancelled() }}"
      name: 保存本次失败的CI增量缓存
      id: citizenapp_ci_android__check__ci_cache_save_failure
      continue-on-error: true
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.citizenapp_ci_android__check__ci_cache.outputs.failure_paths }}"
        key: "${{ steps.citizenapp_ci_android__check__ci_cache.outputs.failure_key }}"
    - if: "${{ failure() && !cancelled() && steps.citizenapp_ci_android__check__ci_cache_save_failure.outcome == 'success' }}"
      continue-on-error: true
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 11
    - if: "${{ success() }}"
      env:
        CI_CACHE_TERMINAL_STATE: success
      shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 12
    - if: "${{ success() }}"
      name: 保存本次成功的CI增量缓存
      id: citizenapp_ci_android__check__ci_cache_save_success
      continue-on-error: true
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.citizenapp_ci_android__check__ci_cache.outputs.success_paths }}"
        key: "${{ steps.citizenapp_ci_android__check__ci_cache.outputs.success_key }}"
    - if: "${{ success() && steps.citizenapp_ci_android__check__ci_cache_save_success.outcome == 'success' }}"
      continue-on-error: true
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_TERMINAL_STATE: success
      shell: bash
      run: node "${TATA_CONSOLE_FLOW_ROOT}/gmb/citizenapp/android/ci/check/execute.mjs" workflow-step 13
    needs:
    - validate_pipeline
    - flow_001
    if: "${{ inputs.pipeline == 'gmb.citizenapp.android.ci' }}"
  flow_003:
    name: 打包公民.apk
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    needs:
    - validate_pipeline
    - flow_001
    - flow_002
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      GMB_SOURCE_SHA: "${{ github.sha }}"
      SOURCE_SHA: "${{ github.sha }}"
    steps:
    - name: 验证准确流程租约
      shell: bash
      env:
        FLOW_LEASE_ID: "${{ inputs.lease_id }}"
        FLOW_SECRET_LEASE_ID: "${{ secrets[format('TATA_FLOW_LEASE_ID_{0}', inputs.lease_id)] }}"
        FLOW_COMMIT_SHA: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}"
        FLOW_BUNDLE_KEY: "${{ secrets[format('TATA_FLOW_BUNDLE_KEY_{0}', inputs.lease_id)] }}"
        FLOW_PROOF: "${{ inputs.proof }}"
      run: |-
        node <<'NODE'
        const {createHmac,timingSafeEqual}=require('node:crypto'),e=process.env;
        const payload=['tata-flow-lease-v1',e.FLOW_LEASE_ID,'VoyagerRhett/GMB',e.FLOW_COMMIT_SHA,'gmb.citizenapp.android.ci','',''].join('\n');
