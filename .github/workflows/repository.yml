# GitHub要求的仓库固定入口；全部产品流程由 TATA/tataconsole/flows 直接实现。
name: GMB · 全仓门禁

on:
  workflow_dispatch:
    inputs:
      pipeline: { description: 分组流水线文件路径, required: true, type: string }
      run_title: { description: 塔塔控制台展示标题, required: true, type: string }
      lease_id: { description: TATA 私有流程租约标识, required: false, type: string }
      proof: { description: TATA 私有流程租约公开证明, required: false, type: string }
      base_sha: { description: 本机全仓门禁通过的准确起始提交, required: false, type: string }
      source_sha: { description: Release 的成功 CI 提交或全仓门禁的准确推送提交, required: false, type: string }
      ci_run_id: { description: 对应成功 CI run id（仅 Release）, required: false, type: string }
      version_tag: { description: 正式版本 Tag（仅 Release）, required: false, type: string }
      software_version: { description: 候选软件版本, required: false, type: string }
      spec_version: { description: Runtime spec_version, required: false, type: string }
      chain_spec_version: { description: 当前链上 spec_version, required: false, type: string }
      genesis_hash: { description: 当前链 genesis hash, required: false, type: string }
      finalized_head: { description: 当前链 finalized head, required: false, type: string }

permissions: { contents: read }
concurrency:
  # 中文注释：每条规范流水线独立串行；全仓门禁只取消自己的旧运行。
  group: ${{ inputs.pipeline }}
  cancel-in-progress: ${{ inputs.pipeline == 'repository' }}
env:
  CI: true
  WRANGLER_SEND_METRICS: false
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # CI 使用 GitHub 锁定的 main；Release 与全仓门禁使用塔塔控制台锁定的 source_sha。
  GMB_SOURCE_SHA: ${{ (inputs.pipeline == 'repository' || endsWith(inputs.pipeline, '.release')) && inputs.source_sha || github.sha }}
  GMB_CI_RUN_ID: ${{ inputs.ci_run_id }}
  GMB_VERSION_TAG: ${{ inputs.version_tag }}
  GMB_SOFTWARE_VERSION: ${{ inputs.software_version }}
  GMB_SPEC_VERSION: ${{ inputs.spec_version }}
  GMB_CHAIN_SPEC_VERSION: ${{ inputs.chain_spec_version }}
  GMB_CHAIN_GENESIS_HASH: ${{ inputs.genesis_hash }}
  GMB_CHAIN_FINALIZED_HEAD: ${{ inputs.finalized_head }}

jobs:
  validate_dispatch:
    name: 校验租约并生成中央作业矩阵
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      has_ci_phase_0: ${{ steps.central_job.outputs.has_ci_phase_0 }}
      ci_phase_0_matrix: ${{ steps.central_job.outputs.ci_phase_0_matrix }}
      has_ci_phase_1: ${{ steps.central_job.outputs.has_ci_phase_1 }}
      ci_phase_1_matrix: ${{ steps.central_job.outputs.ci_phase_1_matrix }}
      has_ci_phase_2: ${{ steps.central_job.outputs.has_ci_phase_2 }}
      ci_phase_2_matrix: ${{ steps.central_job.outputs.ci_phase_2_matrix }}
      has_release_phase_0_standard: ${{ steps.central_job.outputs.has_release_phase_0_standard }}
      release_phase_0_standard_matrix: ${{ steps.central_job.outputs.release_phase_0_standard_matrix }}
      has_release_phase_0_attested: ${{ steps.central_job.outputs.has_release_phase_0_attested }}
      release_phase_0_attested_matrix: ${{ steps.central_job.outputs.release_phase_0_attested_matrix }}
      has_release_phase_1_standard: ${{ steps.central_job.outputs.has_release_phase_1_standard }}
      release_phase_1_standard_matrix: ${{ steps.central_job.outputs.release_phase_1_standard_matrix }}
      has_release_phase_1_attested: ${{ steps.central_job.outputs.has_release_phase_1_attested }}
      release_phase_1_attested_matrix: ${{ steps.central_job.outputs.release_phase_1_attested_matrix }}
      has_release_phase_2_standard: ${{ steps.central_job.outputs.has_release_phase_2_standard }}
      release_phase_2_standard_matrix: ${{ steps.central_job.outputs.release_phase_2_standard_matrix }}
      has_release_phase_2_attested: ${{ steps.central_job.outputs.has_release_phase_2_attested }}
      release_phase_2_attested_matrix: ${{ steps.central_job.outputs.release_phase_2_attested_matrix }}
      has_release_phase_3_standard: ${{ steps.central_job.outputs.has_release_phase_3_standard }}
      release_phase_3_standard_matrix: ${{ steps.central_job.outputs.release_phase_3_standard_matrix }}
      has_release_phase_3_attested: ${{ steps.central_job.outputs.has_release_phase_3_attested }}
      release_phase_3_attested_matrix: ${{ steps.central_job.outputs.release_phase_3_attested_matrix }}
      has_repository_contracts: ${{ steps.central_job.outputs.has_repository_contracts }}
      repository_contracts_matrix: ${{ steps.central_job.outputs.repository_contracts_matrix }}
    steps:
      - name: 校验仓库、流水线、租约证明与冻结提交
        shell: bash
        env:
          FLOW_LEASE_ID: ${{ inputs.lease_id }}
          FLOW_LEASE_PROOF: ${{ inputs.proof }}
          FLOW_SECRET_LEASE_ID: ${{ secrets[format('TATA_FLOW_LEASE_ID_{0}', inputs.lease_id)] }}
          FLOW_COMMIT_SHA: ${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}
          FLOW_BUNDLE_KEY: ${{ secrets[format('TATA_FLOW_BUNDLE_KEY_{0}', inputs.lease_id)] }}
          FLOW_PIPELINE: ${{ inputs.pipeline }}
          FLOW_HEAD_SHA: ${{ inputs.source_sha }}
          GITHUB_LOCKED_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { createHmac, timingSafeEqual } = require('node:crypto');
          const lease = process.env.FLOW_LEASE_ID || '';
          const secretLease = process.env.FLOW_SECRET_LEASE_ID || '';
          const source = process.env.FLOW_COMMIT_SHA || '';
          const pipeline = process.env.FLOW_PIPELINE || '';
          const repositoryGate = pipeline === 'repository';
          const head = repositoryGate ? process.env.FLOW_HEAD_SHA || '' : '';
          const key = process.env.FLOW_BUNDLE_KEY || '';
          const proof = process.env.FLOW_LEASE_PROOF || '';
          const productPipeline = /^gmb\.[a-z][a-z0-9-]*\.[a-z][a-z0-9-]*\.(ci|release)$/.test(pipeline);
          if (!/^[0-9A-F]{24}$/.test(lease) || secretLease !== lease
            || !/^[0-9a-f]{40}$/.test(source) || (!repositoryGate && !productPipeline)
            || (repositoryGate && (!/^[0-9a-f]{40}$/.test(head) || head !== process.env.GITHUB_LOCKED_SHA))
            || !/^[A-Za-z0-9_-]{43}$/.test(key) || !/^[0-9a-f]{64}$/.test(proof)) {
            throw new Error('GMB 流程租约字段或冻结提交无效');
          }
          const payload = ['tata-flow-lease-v1', lease, 'VoyagerRhett/GMB', source, pipeline, head, ''].join('\n');
          const expected = createHmac('sha256', key).update(payload, 'utf8').digest();
          const actual = Buffer.from(proof, 'hex');
          if (actual.length !== expected.length || !timingSafeEqual(actual, expected)) {
            throw new Error('GMB 流程租约证明无效');
          }
          NODE
      - name: 按租约固定提交检出 TATA 私有流程
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: VoyagerRhett/TATA, ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}", token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}", path: .tata-flow, persist-credentials: false }
      - name: 回读固定 TATA 提交
        shell: bash
        env: { FLOW_COMMIT_SHA: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}" }
        run: test "$(git -C .tata-flow rev-parse HEAD)" = "$FLOW_COMMIT_SHA"
      - name: 执行中央共享校验
        id: central_job
        uses: ./.tata-flow/tataconsole/flows/gmb/shared
        with:
          job: validate_dispatch
          pipeline: ${{ inputs.pipeline }}
          run_title: ${{ inputs.run_title }}
          base_sha: ${{ inputs.base_sha }}
          source_sha: ${{ inputs.source_sha }}
          ci_run_id: ${{ inputs.ci_run_id }}
          version_tag: ${{ inputs.version_tag }}
          software_version: ${{ inputs.software_version }}
          spec_version: ${{ inputs.spec_version }}
          chain_spec_version: ${{ inputs.chain_spec_version }}
          genesis_hash: ${{ inputs.genesis_hash }}
          finalized_head: ${{ inputs.finalized_head }}

  retain-current-run:
    if: ${{ inputs.pipeline == 'repository' }}
    name: 预收口门禁历史
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { actions: write, contents: read }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: VoyagerRhett/TATA, ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}", token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}", path: .tata-flow, persist-credentials: false }
      - shell: bash
        env: { FLOW_COMMIT_SHA: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}" }
        run: test "$(git -C .tata-flow rev-parse HEAD)" = "$FLOW_COMMIT_SHA"
      - uses: ./.tata-flow/tataconsole/flows/gmb/shared
        with: { job: retain-current-run, pipeline: "${{ inputs.pipeline }}", run_title: "${{ inputs.run_title }}", source_sha: "${{ inputs.source_sha }}", ci_run_id: "${{ inputs.ci_run_id }}", version_tag: "${{ inputs.version_tag }}", software_version: "${{ inputs.software_version }}", spec_version: "${{ inputs.spec_version }}", chain_spec_version: "${{ inputs.chain_spec_version }}", genesis_hash: "${{ inputs.genesis_hash }}", finalized_head: "${{ inputs.finalized_head }}" }

  repository-contracts:
    if: inputs.pipeline == 'repository' && needs.validate_dispatch.outputs.has_repository_contracts == 'true'
    needs: [validate_dispatch, retain-current-run]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions: { actions: read, contents: read }
    strategy: { fail-fast: false, matrix: "${{ fromJSON(needs.validate_dispatch.outputs.repository_contracts_matrix) }}" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: VoyagerRhett/TATA, ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}", token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}", path: .tata-flow, persist-credentials: false }
      - shell: bash
        env: { FLOW_COMMIT_SHA: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}" }
        run: test "$(git -C .tata-flow rev-parse HEAD)" = "$FLOW_COMMIT_SHA"
      - uses: ./.tata-flow/tataconsole/flows/gmb/shared
        with: { job: "${{ matrix.contract }}", pipeline: "${{ inputs.pipeline }}", run_title: "${{ inputs.run_title }}", base_sha: "${{ inputs.base_sha }}", source_sha: "${{ inputs.source_sha }}", ci_run_id: "${{ inputs.ci_run_id }}" }

  ci_phase_0:
    if: ${{ needs.validate_dispatch.outputs.has_ci_phase_0 == 'true' }}
    needs: validate_dispatch
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions: { actions: write, contents: read }
    strategy: { fail-fast: false, matrix: "${{ fromJSON(needs.validate_dispatch.outputs.ci_phase_0_matrix) }}" }
    env: { GH_TOKEN: "${{ github.token }}", TATA_CONSOLE_CONTEXT_MATRIX_EXPECTED_RUNNER_ARCH: "${{ matrix.context_expected_runner_arch }}", TATA_CONSOLE_CONTEXT_MATRIX_CI_BUNDLE_TARGETS: "${{ matrix.context_ci_bundle_targets }}", TATA_CONSOLE_CONTEXT_MATRIX_MANUAL_BUNDLE_TARGETS: "${{ matrix.context_manual_bundle_targets }}", TATA_CONSOLE_CONTEXT_MATRIX_UPDATER_MANIFEST_NAME: "${{ matrix.context_updater_manifest_name }}", TATA_CONSOLE_CONTEXT_MATRIX_PLATFORM: "${{ matrix.context_platform }}", TATA_CONSOLE_CONTEXT_MATRIX_INSTALLER_NAME: "${{ matrix.context_installer_name }}", TATA_CONSOLE_CONTEXT_MATRIX_UPDATER_ASSET_NAME: "${{ matrix.context_updater_asset_name }}", TATA_CONSOLE_CONTEXT_MATRIX_DEB_ARCH: "${{ matrix.context_deb_arch }}", TATA_CONSOLE_CONTEXT_SECRETS_APP_KEY: "${{ secrets[matrix.secret_app_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_APP_PROFILE: "${{ secrets[matrix.secret_app_profile] }}", TATA_CONSOLE_CONTEXT_SECRETS_IOS_KEY: "${{ secrets[matrix.secret_ios_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_UPDATE_KEY: "${{ secrets[matrix.secret_update_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_UPDATE_PASS: "${{ secrets[matrix.secret_update_pass] }}", TATA_CONSOLE_CONTEXT_SECRETS_WALLET_PROFILE: "${{ secrets[matrix.secret_wallet_profile] }}" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: VoyagerRhett/TATA, ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}", token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}", path: .tata-flow, persist-credentials: false }
      - shell: bash
        env: { FLOW_COMMIT_SHA: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}" }
        run: test "$(git -C .tata-flow rev-parse HEAD)" = "$FLOW_COMMIT_SHA"
      - uses: ./.tata-flow/tataconsole/flows/gmb/shared
        with: { job: dispatch-product, pipeline: "${{ inputs.pipeline }}", run_title: "${{ inputs.run_title }}", source_sha: "${{ inputs.source_sha }}", ci_run_id: "${{ inputs.ci_run_id }}", route_product: "${{ matrix.product }}", route_job: "${{ matrix.route_job }}", route_prepare_job: "${{ matrix.route_prepare_job }}", version_tag: "${{ inputs.version_tag }}", software_version: "${{ inputs.software_version }}", spec_version: "${{ inputs.spec_version }}", chain_spec_version: "${{ inputs.chain_spec_version }}", genesis_hash: "${{ inputs.genesis_hash }}", finalized_head: "${{ inputs.finalized_head }}" }

  ci_phase_1:
    if: ${{ always() && needs.validate_dispatch.result == 'success' && needs.validate_dispatch.outputs.has_ci_phase_1 == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [validate_dispatch, ci_phase_0]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions: { actions: write, contents: read }
    strategy: { fail-fast: false, matrix: "${{ fromJSON(needs.validate_dispatch.outputs.ci_phase_1_matrix) }}" }
    env: { GH_TOKEN: "${{ github.token }}", TATA_CONSOLE_CONTEXT_MATRIX_EXPECTED_RUNNER_ARCH: "${{ matrix.context_expected_runner_arch }}", TATA_CONSOLE_CONTEXT_MATRIX_CI_BUNDLE_TARGETS: "${{ matrix.context_ci_bundle_targets }}", TATA_CONSOLE_CONTEXT_MATRIX_MANUAL_BUNDLE_TARGETS: "${{ matrix.context_manual_bundle_targets }}", TATA_CONSOLE_CONTEXT_MATRIX_UPDATER_MANIFEST_NAME: "${{ matrix.context_updater_manifest_name }}", TATA_CONSOLE_CONTEXT_MATRIX_PLATFORM: "${{ matrix.context_platform }}", TATA_CONSOLE_CONTEXT_MATRIX_INSTALLER_NAME: "${{ matrix.context_installer_name }}", TATA_CONSOLE_CONTEXT_MATRIX_UPDATER_ASSET_NAME: "${{ matrix.context_updater_asset_name }}", TATA_CONSOLE_CONTEXT_MATRIX_DEB_ARCH: "${{ matrix.context_deb_arch }}", TATA_CONSOLE_CONTEXT_SECRETS_APP_KEY: "${{ secrets[matrix.secret_app_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_APP_PROFILE: "${{ secrets[matrix.secret_app_profile] }}", TATA_CONSOLE_CONTEXT_SECRETS_IOS_KEY: "${{ secrets[matrix.secret_ios_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_UPDATE_KEY: "${{ secrets[matrix.secret_update_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_UPDATE_PASS: "${{ secrets[matrix.secret_update_pass] }}", TATA_CONSOLE_CONTEXT_SECRETS_WALLET_PROFILE: "${{ secrets[matrix.secret_wallet_profile] }}" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: VoyagerRhett/TATA, ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}", token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}", path: .tata-flow, persist-credentials: false }
      - shell: bash
        env: { FLOW_COMMIT_SHA: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}" }
        run: test "$(git -C .tata-flow rev-parse HEAD)" = "$FLOW_COMMIT_SHA"
      - uses: ./.tata-flow/tataconsole/flows/gmb/shared
        with: { job: dispatch-product, pipeline: "${{ inputs.pipeline }}", run_title: "${{ inputs.run_title }}", source_sha: "${{ inputs.source_sha }}", ci_run_id: "${{ inputs.ci_run_id }}", route_product: "${{ matrix.product }}", route_job: "${{ matrix.route_job }}", route_prepare_job: "${{ matrix.route_prepare_job }}", version_tag: "${{ inputs.version_tag }}", software_version: "${{ inputs.software_version }}", spec_version: "${{ inputs.spec_version }}", chain_spec_version: "${{ inputs.chain_spec_version }}", genesis_hash: "${{ inputs.genesis_hash }}", finalized_head: "${{ inputs.finalized_head }}" }

  ci_phase_2:
    if: ${{ always() && needs.validate_dispatch.result == 'success' && needs.validate_dispatch.outputs.has_ci_phase_2 == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [validate_dispatch, ci_phase_0, ci_phase_1]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions: { actions: write, contents: read }
    strategy: { fail-fast: false, matrix: "${{ fromJSON(needs.validate_dispatch.outputs.ci_phase_2_matrix) }}" }
    env: { GH_TOKEN: "${{ github.token }}", TATA_CONSOLE_CONTEXT_MATRIX_EXPECTED_RUNNER_ARCH: "${{ matrix.context_expected_runner_arch }}", TATA_CONSOLE_CONTEXT_MATRIX_CI_BUNDLE_TARGETS: "${{ matrix.context_ci_bundle_targets }}", TATA_CONSOLE_CONTEXT_MATRIX_MANUAL_BUNDLE_TARGETS: "${{ matrix.context_manual_bundle_targets }}", TATA_CONSOLE_CONTEXT_MATRIX_UPDATER_MANIFEST_NAME: "${{ matrix.context_updater_manifest_name }}", TATA_CONSOLE_CONTEXT_MATRIX_PLATFORM: "${{ matrix.context_platform }}", TATA_CONSOLE_CONTEXT_MATRIX_INSTALLER_NAME: "${{ matrix.context_installer_name }}", TATA_CONSOLE_CONTEXT_MATRIX_UPDATER_ASSET_NAME: "${{ matrix.context_updater_asset_name }}", TATA_CONSOLE_CONTEXT_MATRIX_DEB_ARCH: "${{ matrix.context_deb_arch }}", TATA_CONSOLE_CONTEXT_SECRETS_APP_KEY: "${{ secrets[matrix.secret_app_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_APP_PROFILE: "${{ secrets[matrix.secret_app_profile] }}", TATA_CONSOLE_CONTEXT_SECRETS_IOS_KEY: "${{ secrets[matrix.secret_ios_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_UPDATE_KEY: "${{ secrets[matrix.secret_update_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_UPDATE_PASS: "${{ secrets[matrix.secret_update_pass] }}", TATA_CONSOLE_CONTEXT_SECRETS_WALLET_PROFILE: "${{ secrets[matrix.secret_wallet_profile] }}" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: VoyagerRhett/TATA, ref: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}", token: "${{ secrets[format('TATA_FLOW_READ_TOKEN_{0}', inputs.lease_id)] }}", path: .tata-flow, persist-credentials: false }
      - shell: bash
        env: { FLOW_COMMIT_SHA: "${{ secrets[format('TATA_FLOW_COMMIT_SHA_{0}', inputs.lease_id)] }}" }
        run: test "$(git -C .tata-flow rev-parse HEAD)" = "$FLOW_COMMIT_SHA"
      - uses: ./.tata-flow/tataconsole/flows/gmb/shared
        with: { job: dispatch-product, pipeline: "${{ inputs.pipeline }}", run_title: "${{ inputs.run_title }}", source_sha: "${{ inputs.source_sha }}", ci_run_id: "${{ inputs.ci_run_id }}", route_product: "${{ matrix.product }}", route_job: "${{ matrix.route_job }}", route_prepare_job: "${{ matrix.route_prepare_job }}", version_tag: "${{ inputs.version_tag }}", software_version: "${{ inputs.software_version }}", spec_version: "${{ inputs.spec_version }}", chain_spec_version: "${{ inputs.chain_spec_version }}", genesis_hash: "${{ inputs.genesis_hash }}", finalized_head: "${{ inputs.finalized_head }}" }

  # 中文注释：每阶段保留 standard/attested 权限隔离；所有先前阶段成功才可推进，
  # 禁止把失败后 skipped 的中间阶段误判为允许汇总或正式 Release。
  release_phase_0_standard:
    if: ${{ needs.validate_dispatch.outputs.has_release_phase_0_standard == 'true' }}
    needs: validate_dispatch
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions: { actions: read, contents: write }
    strategy: { fail-fast: false, matrix: "${{ fromJSON(needs.validate_dispatch.outputs.release_phase_0_standard_matrix) }}" }
    env: { GH_TOKEN: "${{ github.token }}", CARGO_INCREMENTAL: "0", CI: "true", WRANGLER_SEND_METRICS: "false", SOURCE_SHA: "${{ inputs.source_sha }}", CI_RUN_ID: "${{ inputs.ci_run_id }}", TOOL_SHA: "${{ github.sha }}", RELEASE_DIR: "${{ matrix.release_dir == '' && '' || format('{0}/{1}', github.workspace, matrix.release_dir) }}", CANDIDATE_DIR: "${{ matrix.candidate_dir == '' && '' || format('{0}/{1}', github.workspace, matrix.candidate_dir) }}", ARCHIVE_PATH: "${{ matrix.archive_path == '' && '' || format('{0}/{1}', github.workspace, matrix.archive_path) }}", TATA_CONSOLE_CONTEXT_MATRIX_EXPECTED_RUNNER_ARCH: "${{ matrix.context_expected_runner_arch }}", TATA_CONSOLE_CONTEXT_MATRIX_CI_BUNDLE_TARGETS: "${{ matrix.context_ci_bundle_targets }}", TATA_CONSOLE_CONTEXT_MATRIX_MANUAL_BUNDLE_TARGETS: "${{ matrix.context_manual_bundle_targets }}", TATA_CONSOLE_CONTEXT_MATRIX_UPDATER_MANIFEST_NAME: "${{ matrix.context_updater_manifest_name }}", TATA_CONSOLE_CONTEXT_MATRIX_PLATFORM: "${{ matrix.context_platform }}", TATA_CONSOLE_CONTEXT_MATRIX_INSTALLER_NAME: "${{ matrix.context_installer_name }}", TATA_CONSOLE_CONTEXT_MATRIX_UPDATER_ASSET_NAME: "${{ matrix.context_updater_asset_name }}", TATA_CONSOLE_CONTEXT_MATRIX_DEB_ARCH: "${{ matrix.context_deb_arch }}", TATA_CONSOLE_CONTEXT_SECRETS_APP_KEY: "${{ secrets[matrix.secret_app_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_APP_PROFILE: "${{ secrets[matrix.secret_app_profile] }}", TATA_CONSOLE_CONTEXT_SECRETS_IOS_KEY: "${{ secrets[matrix.secret_ios_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_UPDATE_KEY: "${{ secrets[matrix.secret_update_key] }}", TATA_CONSOLE_CONTEXT_SECRETS_UPDATE_PASS: "${{ secrets[matrix.secret_update_pass] }}", TATA_CONSOLE_CONTEXT_SECRETS_WALLET_PROFILE: "${{ secrets[matrix.secret_wallet_profile] }}" }
