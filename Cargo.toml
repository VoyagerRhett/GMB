[workspace]         # 声明整个仓库的工作空间
members = [
    "citizenchain/crates/qr-protocol",       # QR_V1 协议、registry、生成器与跨端守卫唯一真源
]
# 各产品拥有自己的 Cargo workspace 和锁文件；根 workspace 只管理公民链 QR 协议工具 crate，
# 禁止把产品内路径依赖自动吸入根 workspace 后错误继承根 package 元数据。
exclude = [
    "citizenchain/**",
    "citizenapp/**",
    "citizenwallet/**",
    "citizensdk/**",
]
resolver = "2"      # 使用 Cargo 新版依赖解析器，减少 feature 冲突

[workspace.package]                                                 # 元信息（作为整个仓库的默认元数据）
edition = "2021"                                                    # Rust 版本规范（2021 Edition）
version = "1.0.0"                                                   # 整个工作空间的统一版本号（子 crate 可继承或覆盖）
authors = ["voyager_rhett <chinanation@icloud.com>"]                # 作者信息
repository = "https://github.com/VoyagerRhett/GMB"                   # 项目仓库地址
homepage = "https://github.com/VoyagerRhett/GMB"                     # 项目主页
license = "MIT"                                                     # 开源协议

[workspace.lints.rust]                                              # 仓库级共享 Rust crate 统一规则
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# 本地（统一给需要的子项目复用）
citizenchain = { path = "citizenchain/runtime" }

# 工具
codec      = { package = "parity-scale-codec", version = "3.6.1", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }
serde      = { version = "1.0.197", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.114", default-features = false, features = ["alloc"] }
thiserror  = { version = "1.0.64" }
clap       = { version = "4.5.3", features = ["derive"] }
futures    = { version = "0.3.30", features = ["thread-pool"] }
jsonrpsee  = { version = "0.24.2", features = ["server"] }
arrayvec   = { version = "0.7.6", default-features = false }

# SDK 核心零件（统一使用指定 Polkadot SDK 提交）
sp-api = { git = "https://github.com/VoyagerRhett/polkadot-sdk.git", rev = "1aa4447575d446ab393e89b86cd8ec0a8fca100d", default-features = false }
