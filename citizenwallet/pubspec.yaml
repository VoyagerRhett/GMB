name: citizenwallet
description: GMB 离线签名设备 — 软件形态的硬件钱包。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 密钥派生 + 签名
  # sr25519 派生/签名/验签走原生 schnorrkel(lib/wallet/native_sr25519.dart →
  # rust/src/sr25519.rs，由本产品独立维护)。
  # polkadart_keyring 仅用于 SS58 地址编解码(base58 + 校验和，非密码学)。
  # 与 CitizenApp 的 polkadart 0.7.x 生态保持同一 ss58 1.x 依赖图。
  polkadart_keyring: 0.7.1
  # 与产品内派生实现的 substrate_bip39 ^0.7.0 约束一致。
  bip39_mnemonic: 4.0.1
  ffi: ^2.2.0
  path: ^1.9.1
  # 哈希 + 加密
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  # 存储
  # Isar 3.1 上游预编译 libisar.so 只有 4 KB ELF 对齐；统一切换到
  # 16 KB 对齐的社区维护分支，保持现有 3.x API、集合与数据库格式。
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  # 生物识别
  local_auth: ^3.0.2
  # 生物识别对话框文案本地化需要直接引用消息类(local_auth 不再导出它们)。
  # 版本跟随 local_auth 的传递依赖,不单独升级。
  local_auth_android: 2.0.9
  local_auth_darwin: ^2.0.0
  # 二维码设备走本产品内部适配器；本产品只处理签名请求业务。
  mobile_scanner: ^7.1.4
  substrate_bip39: ^0.7.0
  unorm_dart: ^0.3.2
  qr_flutter: ^4.1.0
  # SVG 图标
  flutter_svg: ^2.3.0
  # 相册图片选择
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 两款移动产品共同使用的代码生成器固定同一解析版本。
  build_runner: 2.15.0
  isar_community_generator: ^3.3.2

flutter:
  # 与 CitizenApp 共用 Flutter 3.44.4 + CocoaPods 的唯一 iOS 依赖模式；
  # 不读取本机全局 SPM 开关，避免两款产品生成不同的原生工程状态。
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - resources/icons/
